<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NVIDIA GPU List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    function conv_date_time_utc_to_local(utc_date_time) {
      let date = new Date(utc_date_time);
      let local_date_time = new Intl.DateTimeFormat('en-US', {
          hour12: false,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
      }).format(date);
      return local_date_time;
    }

    function create_title_text(title, data) {
      let json = JSON.parse(data);
      let utc_date_time = json["date_time"];
      if (utc_date_time != undefined)
      {
        let local_date_time = conv_date_time_utc_to_local(utc_date_time);
        title += ` (Updated at ${local_date_time})`;
      }
      return title;
    }

    function get_cuda_versions(compute_capability, callback) {
      fetch(`https://vic.onl/find_cuda_versions.php?compute_capability=${compute_capability}`)
        .then(response => response.json())
        .then(data => {
          callback(data.items);
        })
        .catch(error => {
          console.error('Error fetching CUDA versions:', error);
          callback([]);
        });
    }

    function show_cuda_versions(compute_capability, versions) {
      let s = `CUDA Versions for Compute Capability ${compute_capability}:\n\n` + versions.join(', ');
      s = s.slice(0, s.length - 1);
      s = s.replace(" and ", ", and ");
      alert(s);
    }

    function json_cell_creation_callback(key, val) {
      let result = val;
      if (key == "name") {
        let name = (val || "").replace(" ", "+");
        result = `<a href="https://www.google.com/search?q=site%3Atechpowerup.com+${name}&newwindow=1" target="_blank" title="Click to see details">${val}</a>`;
      }
      else if (key == "link") {
        result = `<a href="${val}" target="_blank" title="Click to see specs">${val}</a>`;
      }
      else if (key == "compute_capability") {
        result = `<a href="#" onclick="get_cuda_versions('${val}', versions => show_cuda_versions('${val}', versions))" title="Click to find all supported cuda versions">${val}</a>`;
      }
      return result;
    }

    /**
     * Render the parsed list as ONE flat table: the category and compute capability
     * cells span their whole group with rowspan, so the link between the columns is
     * obvious at a glance.
     */
    function render_gpu_table(container, list) {
      const table = document.createElement("table");
      table.className = "table table-sm table-bordered table-hover align-middle mb-0";
      table.innerHTML = `<thead class="table-light">
        <tr>
          <th scope="col">Category</th>
          <th scope="col">Compute Capability</th>
          <th scope="col">GPU</th>
        </tr>
      </thead>`;

      const tbody = table.createTBody();
      list.forEach((category) => {
        const row_count = category.list.reduce((total, cc) => total + cc.list.length, 0);

        category.list.forEach((cc, cc_index) => {
          cc.list.forEach((item, item_index) => {
            const row = tbody.insertRow();

            if (cc_index === 0 && item_index === 0) {
              const cell = row.insertCell();
              cell.rowSpan = row_count;
              cell.className = "fw-semibold text-nowrap align-top bg-body-tertiary";
              cell.textContent = category.name;
            }
            if (item_index === 0) {
              const cell = row.insertCell();
              cell.rowSpan = cc.list.length;
              cell.className = "fw-semibold text-nowrap align-top";
              cell.innerHTML = json_cell_creation_callback("compute_capability", cc.name);
            }

            const cell = row.insertCell();
            cell.innerHTML = json_cell_creation_callback("name", item.name);
          });
        });
      });

      container.appendChild(table);
    }
  </script>
</head>
<body class="bg-body-tertiary">
  <header class="bg-dark text-white py-4 mb-4">
    <div class="container">
      <h1 class="h3 mb-0">NVIDIA GPU List</h1>
      <p class="mb-0 text-white-50">Automated daily updates from the official website</p>
    </div>
  </header>

  <main class="container pb-4">
    <section class="card shadow-sm mb-4">
      <div class="card-header bg-white"><h2 class="h5 mb-0" id="title_1"></h2></div>
      <div class="card-body p-0"><div class="table-responsive" id="table_1"></div></div>
    </section>

    <script>
      fetch("./data/nvidia.com_cuda-gpus.json")
      .then(response => response.text())
      .then(text => {
        let json_content = JSON.parse(text);
        let table = document.getElementById("table_1");
        render_gpu_table(table, json_content.list);
        let title = create_title_text("CUDA GPUs", text);
        document.getElementById("title_1").textContent = title;
      })
    </script>

    <section class="card shadow-sm mb-4">
      <div class="card-header bg-white"><h2 class="h5 mb-0" id="title_2"></h2></div>
      <div class="card-body p-0"><div class="table-responsive" id="table_2"></div></div>
    </section>

    <script>
      fetch("./data/nvidia.com_cuda-legacy-gpus.json")
      .then(response => response.text())
      .then(text => {
        let json_content = JSON.parse(text);
        let table = document.getElementById("table_2");
        render_gpu_table(table, json_content.list);
        let title = create_title_text("CUDA Legacy GPUs", text);
        document.getElementById("title_2").textContent = title;
      })
    </script>
  </main>

  <footer class="text-center text-body-secondary py-4 border-top">
    Copyright (c) Vic P.
  </footer>
</body>
</html>
